      <section id="contact">
    <div class="container">
        <div class="row">
            <div class="col-lg-12 text-center">
                <h2 class="section-heading">Contact Us |ω･`) </h2>
                <h3 class="section-subheading text-muted">Share Your Favorite Memes (◔౪◔)</h3>
            </div>
        </div>
        <div class="row">
            <div class="col-lg-12">
                <form name="sentMessage" id="contactForm" action="/luusss"  method="POST" enctype="multipart/form-data">
           
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <input type="text" class="form-control" placeholder="Your Name ₍ᐢっ ᎑•ᐢ₎ *" id="name" name="username" required
                                    data-validation-required-message="Please enter your name.">
                                <p class="help-block text-danger"></p>
                            </div>
                            <div class="form-group">
                                <input type="email" class="form-control" placeholder="Your Email 📧 *" id="email" name="email"
                                    required data-validation-required-message="Please enter your email address.">
                                <p class="help-block text-danger"></p>
                            </div>
                            <div class="form-group">
                                <input type="tel" class="form-control" placeholder="Your Phone 📞 *" id="phone" name="phone"
                                    required data-validation-required-message="Please enter your phone number.">
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <textarea class="form-control" placeholder="Your Memes Message ✍(◦`꒳´◦)۶ *" id="message" name="msg" required
                                    data-validation-required-message="Please enter a message."></textarea>
                                <p class="help-block text-danger"></p>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <input type="file" name="myFile1" id="myFile1" accept="image/*">
                            </div>
                        </div>
                        <div class="clearfix"></div>
                        <div class="col-lg-12 text-center">
                            <div id="success"></div>
                            <button type="submit" class="btn btn-xl">Send📨</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

     <script>
       
      gsap.to("#title", { scrollTrigger: { scrub: 1 }, scale: 0.5, duration: 3 });

        window.addEventListener("scroll", () => {
            const cards = document.querySelectorAll(".meme-card img");
        
            cards.forEach(img => {
                const speed = 0.2; // 視差速度（數字越大，動得越多）
                const rect = img.getBoundingClientRect();
                const offset = rect.top * speed;
        
                img.style.transform = `translateY(${offset}px)`;
            });
        });
        </script>
